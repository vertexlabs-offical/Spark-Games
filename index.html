/* =============================================
   SPARKGAMES v2 — 3D Animated Edition
   ============================================= */
:root {
  --orange: #ff6b00;
  --orange-glow: #ff8c2a;
  --dark: #0a0a0a;
  --card-bg: rgba(22,22,22,0.8);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

/* 3D Perspective Root */
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--dark);
  color: #e0e0e0;
  min-height: 100vh;
  overflow-x: hidden;
  perspective: 1200px;
  perspective-origin: 50% 0%;
}

/* ========== ANIMATED GRADIENT BACKGROUND ========== */
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 600px 400px at 20% 0%, rgba(255,107,0,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 500px 500px at 80% 50%, rgba(255,140,42,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 400px 300px at 50% 100%, rgba(255,107,0,0.06) 0%, transparent 50%);
}

/* ========== FLOATING 3D ORBS ========== */
.orb {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
  filter: blur(80px); opacity: 0.12;
  animation-timing-function: ease-in-out; animation-iteration-count: infinite;
}
.orb-1 { width: 350px; height: 350px; background: #ff6b00; top: -100px; left: -80px; animation: orbFloat1 14s infinite; }
.orb-2 { width: 280px; height: 280px; background: #ff8c2a; top: 40%; right: -100px; animation: orbFloat2 18s infinite; }
.orb-3 { width: 200px; height: 200px; background: #ff5500; bottom: -60px; left: 30%; animation: orbFloat3 12s infinite; }

@keyframes orbFloat1 {
  0%, 100% { transform: translate(0,0) scale(1); }
  25% { transform: translate(60px,40px) scale(1.15); }
  50% { transform: translate(-20px,80px) scale(0.9); }
  75% { transform: translate(-50px,-30px) scale(1.1); }
}
@keyframes orbFloat2 {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(-70px,-50px) scale(1.2); }
  66% { transform: translate(30px,60px) scale(0.85); }
}
@keyframes orbFloat3 {
  0%, 100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(80px,-40px) scale(1.25); }
}

/* ========== PARTICLE CANVAS ========== */
#particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

/* ========== HEADER — GLASSMORPHISM ========== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(12,12,12,0.75);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid rgba(255,107,0,0.3);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  transform: translateZ(20px);
}
.logo {
  display: flex; align-items: center; cursor: pointer; user-select: none;
  transition: all 0.3s;
  flex-shrink: 0;
}
.logo:hover { transform: scale(1.04); }
.logo-img {
  height: 38px; width: auto; display: block;
  filter: drop-shadow(0 0 14px rgba(255,107,0,0.4));
  transition: filter 0.3s;
}
.logo:hover .logo-img {
  filter: drop-shadow(0 0 24px rgba(255,107,0,0.75));
}

/* ========== SEARCH ========== */
.search-wrap { flex: 1; min-width: 200px; max-width: 440px; position: relative; }
.search-wrap input {
  width: 100%; padding: 11px 18px 11px 44px;
  border-radius: 28px; border: 2px solid rgba(255,107,0,0.2);
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(10px);
  color: #fff; font-size: 0.95rem;
  transition: all 0.4s cubic-bezier(0.4,0,0.2,1); outline: none;
}
.search-wrap input::placeholder { color: #666; }
.search-wrap input:focus {
  border-color: var(--orange);
  box-shadow: 0 0 30px rgba(255,107,0,0.2), 0 0 60px rgba(255,107,0,0.08);
  background: rgba(255,255,255,0.07);
}
.search-wrap .search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: #777; font-size: 1.1rem; transition: color 0.3s;
}
.search-wrap input:focus ~ .search-icon, .search-wrap:focus-within .search-icon { color: var(--orange); }

/* ========== CTA BUTTON ========== */
.header-cta {
  background: linear-gradient(135deg, #ff6b00, #ff9500);
  color: #000; border: none; padding: 11px 24px;
  border-radius: 28px; font-weight: 700; cursor: pointer;
  font-size: 0.9rem; white-space: nowrap;
  position: relative; overflow: hidden;
  transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 4px 20px rgba(255,107,0,0.35);
}
.header-cta::after {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
  animation: shimmer 2.5s infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%) rotate(0deg); }
  100% { transform: translateX(100%) rotate(0deg); }
}

.header-cta:hover {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 8px 35px rgba(255,107,0,0.5);
}

/* ========== HERO — 3D PARALLAX ========== */
.hero {
  position: relative; z-index: 1; text-align: center;
  padding: 70px 20px 40px;
  transform-style: preserve-3d;
}
.hero h1 {
  font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 900; color: #fff;
  animation: heroSlideIn 0.8s cubic-bezier(0.22,0.61,0.36,1);
  text-shadow: 0 2px 30px rgba(0,0,0,0.5);
}
.hero h1 .hl {
  background: linear-gradient(135deg, #ff6b00, #ffaa00);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 3s ease infinite;
  background-size: 200% 200%;
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes heroSlideIn {
  from { opacity: 0; transform: translateY(40px) translateZ(-40px); }
  to { opacity: 1; transform: translateY(0) translateZ(0); }
}
.hero p {
  color: #999; margin-top: 10px; font-size: 1.15rem;
  animation: heroSlideIn 0.8s 0.15s cubic-bezier(0.22,0.61,0.36,1) both;
}
.hero-emoji {
  display: inline-block; font-size: 1.6rem;
  animation: bounceEmoji 1.5s ease-in-out infinite;
}
@keyframes bounceEmoji {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

/* ========== CATEGORIES ========== */
.categories {
  position: relative; z-index: 1;
  display: flex; gap: 10px; padding: 0 20px 24px;
  flex-wrap: wrap; justify-content: center;
  animation: heroSlideIn 0.8s 0.3s cubic-bezier(0.22,0.61,0.36,1) both;
}
.cat-btn {
  padding: 9px 20px; border-radius: 28px;
  border: 2px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(8px);
  color: #bbb; cursor: pointer; font-size: 0.9rem;
  font-weight: 600; white-space: nowrap;
  transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  position: relative; overflow: hidden;
}

.cat-btn::before {
  content: ''; position: absolute; inset: 0; border-radius: 28px;
  background: linear-gradient(135deg, #ff6b00, #ff9500);
  opacity: 0; transition: opacity 0.35s; z-index: -1;
}
.cat-btn:hover { border-color: rgba(255,107,0,0.5); color: #fff; transform: translateY(-2px); }
.cat-btn:hover::before { opacity: 0.1; }
.cat-btn.active {
  background: linear-gradient(135deg, #ff6b00, #ff9500);
  color: #000; border-color: transparent;
  box-shadow: 0 4px 25px rgba(255,107,0,0.4);
  transform: translateY(-1px);
}
.cat-btn.active::before { opacity: 0; }
.cat-btn .cat-count {
  font-size: 0.72rem; opacity: 0.7; margin-left: 4px;
  background: rgba(0,0,0,0.2); padding: 2px 7px; border-radius: 10px;
}

/* ========== GAME COUNT ========== */
.game-count {
  position: relative; z-index: 1;
  padding: 0 20px 16px; text-align: center; color: #777; font-size: 0.85rem;
  animation: heroSlideIn 0.8s 0.35s cubic-bezier(0.22,0.61,0.36,1) both;
}

/* ========== GAME GRID ========== */
.game-grid {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 22px; padding: 0 24px 50px;
  max-width: 1440px; margin: 0 auto;
}

/* ========== 3D GAME CARD ========== */
.game-card {
  background: var(--card-bg);
  border-radius: 20px;
  overflow: hidden; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.5s cubic-bezier(0.22,0.61,0.36,1);
  position: relative;
  transform-style: preserve-3d;
  transform: translateZ(0);
  animation: cardAppear 0.6s cubic-bezier(0.22,0.61,0.36,1) both;
  backdrop-filter: blur(8px);
}
.game-card::before {
  content: ''; position: absolute; inset: -1px; border-radius: 21px; z-index: -1;
  background: linear-gradient(135deg, rgba(255,107,0,0), rgba(255,107,0,0.15), rgba(255,107,0,0));
  opacity: 0; transition: opacity 0.5s;
}
.game-card::after {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
  transition: left 0.6s;
}
.game-card:hover::after { left: 100%; }
.game-card:hover::before { opacity: 1; }
.game-card:hover {
  transform: translateY(-8px) rotateY(var(--tilt-y, 0deg)) rotateX(var(--tilt-x, 0deg)) scale(1.03);
  border-color: rgba(255,107,0,0.4);
  box-shadow:
    0 20px 50px rgba(0,0,0,0.5),
    0 0 40px rgba(255,107,0,0.15),
    0 0 80px rgba(255,107,0,0.05);
}
.game-card .thumb-wrap { overflow: hidden; position: relative; }
.game-card .thumb {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block;
  transition: transform 0.6s cubic-bezier(0.22,0.61,0.36,1);
}
.game-card:hover .thumb { transform: scale(1.08); }
.game-card .thumb-shine {
  position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  transform: skewX(-20deg); transition: left 0.7s;
}
.game-card:hover .thumb-shine { left: 150%; }
.game-card .badge {
  position: absolute; top: 12px; right: 12px;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  color: var(--orange); font-size: 0.7rem; font-weight: 700;
  padding: 4px 10px; border-radius: 12px;
  border: 1px solid rgba(255,107,0,0.3);
}
.game-card .info { padding: 16px; position: relative; z-index: 1; }
.game-card .info h3 {
  font-size: 0.95rem; font-weight: 700; color: #fff;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color 0.3s;
}
.game-card:hover .info h3 { color: var(--orange); }
.game-card .info .genre {
  font-size: 0.78rem; color: var(--orange); margin-top: 5px; font-weight: 600;
  opacity: 0.8;
}

/* Play Overlay */
.game-card .play-overlay {
  position: absolute; inset: 0; z-index: 2;
  background: rgba(0,0,0,0.55); display: flex; align-items: center;
  justify-content: center; opacity: 0;
  transition: opacity 0.4s cubic-bezier(0.22,0.61,0.36,1);
  backdrop-filter: blur(2px);
}
.game-card:hover .play-overlay { opacity: 1; }
.play-btn-big {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, #ff6b00, #ff9500);
  border: none; color: #000; font-size: 1.4rem;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px rgba(255,107,0,0.6);
  transition: all 0.3s cubic-bezier(0.22,0.61,0.36,1);
  animation: playPulse 1.8s ease-in-out infinite;
}
@keyframes playPulse {
  0%, 100% { box-shadow: 0 0 40px rgba(255,107,0,0.6); }
  50% { box-shadow: 0 0 65px rgba(255,107,0,0.9), 0 0 100px rgba(255,107,0,0.3); }
}
.play-btn-big:hover { transform: scale(1.2); }

/* Staggered card appear */
@keyframes cardAppear {
  from { opacity: 0; transform: translateY(60px) translateZ(-30px) rotateX(5deg); }
  to { opacity: 1; transform: translateY(0) translateZ(0) rotateX(0); }
}

/* No Results */
.no-results {
  text-align: center; padding: 80px 20px; grid-column: 1/-1;
  animation: heroSlideIn 0.5s cubic-bezier(0.22,0.61,0.36,1);
}
.no-results h2 { color: var(--orange); font-size: 2rem; }
.no-results p { color: #888; margin-top: 8px; font-size: 1.1rem; }

/* ========== MODAL — 3D SCALE ENTRANCE ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.93); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 15px;
  animation: modalFadeIn 0.35s ease;
  backdrop-filter: blur(10px);
}
@keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-container {
  width: 100%; max-width: 1340px;
  display: flex; gap: 14px; max-height: 94vh;
  animation: modalScaleIn 0.45s cubic-bezier(0.22,0.61,0.36,1);
  transform-style: preserve-3d;
}
@keyframes modalScaleIn {
  from { opacity: 0; transform: scale(0.9) translateZ(-80px) rotateX(5deg); }
  to { opacity: 1; transform: scale(1) translateZ(0) rotateX(0); }
}

/* Side Ads */
.modal-ad-left, .modal-ad-right {
  width: 160px; min-width: 130px;
  display: flex; flex-direction: column; gap: 14px; flex-shrink: 0;
}
.ad-slot {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 16px 8px;
  transition: all 0.4s; backdrop-filter: blur(8px);
}
.ad-slot:hover {
  border-color: rgba(255,107,0,0.4);
  box-shadow: 0 0 25px rgba(255,107,0,0.1);
}
.ad-slot .ad-label {
  font-size: 0.62rem; color: #555; text-transform: uppercase;
  letter-spacing: 3px; margin-bottom: 8px;
}
.ad-slot .ad-content { color: #777; font-size: 0.78rem; line-height: 1.4; }
.ad-slot .ad-img-placeholder {
  width: 100%; height: 160px;
  background: linear-gradient(135deg, rgba(255,107,0,0.05), rgba(255,140,42,0.08));
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  color: #444; font-size: 2.2rem;
  animation: adPulse 3s ease-in-out infinite;
}
@keyframes adPulse {
  0%, 100% { background: linear-gradient(135deg, rgba(255,107,0,0.05), rgba(255,140,42,0.08)); }
  50% { background: linear-gradient(135deg, rgba(255,107,0,0.08), rgba(255,140,42,0.12)); }
}
.ad-slot.tall .ad-img-placeholder { height: 310px; }

/* Modal Center */
.modal-center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0 12px; flex-shrink: 0;
}
.modal-header h2 { color: #fff; font-size: 1.25rem; font-weight: 700; }
.modal-close {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-size: 1.2rem; cursor: pointer;
  transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover {
  background: #ff4500; border-color: #ff4500;
  transform: rotate(90deg);
  box-shadow: 0 0 20px rgba(255,69,0,0.5);
}

/* Game frame */
.game-frame-wrap {
  flex: 1; position: relative; background: #000;
  border-radius: 16px; overflow: hidden;
  border: 2px solid rgba(255,107,0,0.5);
  box-shadow:
    0 0 50px rgba(255,107,0,0.12),
    0 0 100px rgba(255,107,0,0.04),
    inset 0 0 80px rgba(0,0,0,0.5);
}
.game-frame-wrap iframe {
  width: 100%; height: 100%; border: none; display: block; min-height: 500px;
}

/* Top/Bottom ad banners */
.modal-ad-top, .modal-ad-bottom { width: 100%; flex-shrink: 0; }
.modal-ad-top .ad-slot, .modal-ad-bottom .ad-slot {
  display: flex; align-items: center; justify-content: center;
  padding: 12px; flex-direction: row; gap: 12px; min-height: 75px;
  border-radius: 12px; margin: 6px 0;
}

/* ========== FOOTER ========== */
.footer {
  position: relative; z-index: 1; text-align: center; padding: 35px 20px;
  border-top: 1px solid rgba(255,255,255,0.05); color: #555; font-size: 0.85rem;
}
.footer span { color: var(--orange); font-weight: 700; }

/* ========== RESPONSIVE ========== */
@media (max-width: 1050px) { .modal-ad-left, .modal-ad-right { display: none; } }
@media (max-width: 640px) {
  .header { gap: 8px; padding: 8px 12px; }
  .logo-img { height: 30px; }
  .hero { padding: 40px 16px 24px; }
  .hero h1 { font-size: 1.8rem; }
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 0 12px 30px; }
  .game-frame-wrap iframe { min-height: 320px; }
  .header-cta { display: none; }
  .categories { gap: 6px; }
  .cat-btn { padding: 7px 14px; font-size: 0.78rem; }
  .modal-container { padding: 4px; }
  .modal-header h2 { font-size: 1rem; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-track { background: #0a0a0a; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--orange); }
</style>
</head>

// ==================== renderCategories ====================
function renderCategories() {
  var nav = document.getElementById("categoryNav");
  var html = "";
  for (var i = 0; i < CATEGORIES.length; i++) {
    var c = CATEGORIES[i];
    var count = c.id === "all" ? GAMES.length : GAMES.filter(function(g){ return g.category === c.id; }).length;
    html += '<button class="cat-btn' + (activeCategory === c.id ? ' active' : '') + '" onclick="setCategory(\'' + c.id + '\')">' + c.icon + ' ' + c.label + '<span class="cat-count">' + count + '</span></button>';
  }
  nav.innerHTML = html;
}

function setCategory(catId) { activeCategory = catId; renderCategories(); renderGames(); }

// ==================== renderGames ====================
function renderGames() {
  var searchTerm = document.getElementById("searchInput").value.toLowerCase().trim();
  var filtered = GAMES.slice();
  if (activeCategory !== "all") filtered = filtered.filter(function(g){ return g.category === activeCategory; });
  if (searchTerm) {
    filtered = filtered.filter(function(g){
      return g.title.toLowerCase().indexOf(searchTerm) !== -1 || g.genre.toLowerCase().indexOf(searchTerm) !== -1 || g.category.toLowerCase().indexOf(searchTerm) !== -1;
    });
  }
  document.getElementById("gameCount").textContent = "Showing " + filtered.length + " game" + (filtered.length !== 1 ? "s" : "");

  var grid = document.getElementById("gameGrid");
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results"><h2>😅 No Games Found</h2><p>Try a different search or category.</p></div>';
    return;
  }

  var html = "";
  for (var i = 0; i < filtered.length; i++) {
    var g = filtered[i];
    var delay = (i * 0.04) + 's';
    html += '<div class="game-card" style="animation-delay:' + delay + '" data-game-id="' + g.id + '" data-game-title="' + g.title.replace(/"/g, '&quot;') + '" data-game-slug="' + g.slug + '">' +
      '<div class="thumb-wrap">' +
        '<img class="thumb" src="https://img.gamedistribution.com/' + g.id + '-512x384.jpg" alt="' + g.title + '" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22><rect fill=%22%231a1a1a%22 width=%22400%22 height=%22300%22 rx=%2212%22/><text fill=%22%23444%22 x=%22200%22 y=%22160%22 text-anchor=%22middle%22 font-size=%2232%22>🎮</text></svg>\'">' +
        '<div class="thumb-shine"></div>' +
        '<div class="badge">' + g.genre + '</div>' +
      '</div>' +
      '<div class="info"><h3>' + g.title + '</h3><div class="genre">' + g.genre + '</div></div>' +
      '<div class="play-overlay"><div class="play-btn-big">▶</div></div>' +
    '</div>';
  }
  grid.innerHTML = html;

  // Attach 3D tilt + click for all cards
  var cards = grid.querySelectorAll('.game-card');
  for (var j = 0; j < cards.length; j++) {
    (function(card) {
      card.addEventListener('mousemove', function(e) {
        var rect = card.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var cx = rect.width / 2;
        var cy = rect.height / 2;
        var tiltX = ((y - cy) / cy) * -12;
        var tiltY = ((x - cx) / cx) * 12;
        card.style.setProperty('--tilt-x', tiltX + 'deg');
        card.style.setProperty('--tilt-y', tiltY + 'deg');
      });
      card.addEventListener('mouseleave', function() {
        card.style.setProperty('--tilt-x', '0deg');
        card.style.setProperty('--tilt-y', '0deg');
      });
      card.addEventListener('click', function(e) {
        // Don't trigger if clicking overlay button directly (handled by openGame anyway)
        var id = card.getAttribute('data-game-id');
        var slug = card.getAttribute('data-game-slug');
        var title = card.getAttribute('data-game-title');
        openGame(id, slug, title);
      });
    })(cards[j]);
  }
}

document.addEventListener("keydown", function(e) {

// ==================== 3D PARTICLE SYSTEM ====================
(function() {
  var canvas = document.getElementById("particles");
  var ctx = canvas.getContext("2d");
  var particles = [];
  var mouseX = 0, mouseY = 0;

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener("resize", resize);
  document.addEventListener("mousemove", function(e) { mouseX = e.clientX; mouseY = e.clientY; });
  resize();

  for (var i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      z: Math.random() * 300,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      size: Math.random() * 2.5 + 0.5,
      baseAlpha: Math.random() * 0.5 + 0.15
    });
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw particles with parallax
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -20) p.x = canvas.width + 20;
      if (p.x > canvas.width + 20) p.x = -20;
      if (p.y < -20) p.y = canvas.height + 20;
      if (p.y > canvas.height + 20) p.y = -20;

      // Parallax based on mouse
      var parallaxX = (mouseX - canvas.width/2) * (p.z / 300) * 0.01;
      var parallaxY = (mouseY - canvas.height/2) * (p.z / 300) * 0.01;
      var drawX = p.x + parallaxX;
      var drawY = p.y + parallaxY;
      var depthScale = (p.z + 100) / 400;
      var drawSize = p.size * depthScale;

      ctx.beginPath();
      ctx.arc(drawX, drawY, drawSize, 0, Math.PI * 2);
      var alpha = p.baseAlpha * depthScale;
      ctx.fillStyle = "rgba(255,107,0," + alpha + ")";
      ctx.fill();

      // Glow on closer particles
      if (p.z < 150) {
        ctx.beginPath();
        ctx.arc(drawX, drawY, drawSize * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,107,0," + (alpha * 0.15) + ")";
        ctx.fill();
      }
    }

    // Connections
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var dx = particles[i].x - particles[j].x;
        var dy = particles[i].y - particles[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var maxDist = 130;
        if (dist < maxDist) {
          var alpha = 0.06 * (1 - dist / maxDist) * ((particles[i].z + particles[j].z) / 600);
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = "rgba(255,107,0," + alpha + ")";
          ctx.lineWidth = 0.4;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
})();
